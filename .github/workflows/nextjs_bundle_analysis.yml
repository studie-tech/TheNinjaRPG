name: "Next.js Bundle Analysis"

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - "app/**"
      - ".github/workflows/nextjs_bundle_analysis.yml"
  push:
    branches:
      - main
    paths:
      - "app/**"
      - ".github/workflows/nextjs_bundle_analysis.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: ./app/

permissions:
  contents: read # for checkout repository
  actions: read # for fetching base branch bundle stats
  pull-requests: write # for comments

jobs:
  secret-check:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    outputs:
      HAS_CLERK_KEY: ${{ steps.check-secret.outputs.hasSecret }}
    steps:
      - name: Check secret
        working-directory: .
        id: check-secret
        env:
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY != '' }}
        run: echo "hasSecret=$CLERK_SECRET_KEY" >> "$GITHUB_OUTPUT"

  analyze:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: secret-check
    if: needs.secret-check.outputs.HAS_CLERK_KEY == 'true'

    steps:
      - uses: actions/checkout@v7
        with:
          # No step here runs git, so the job never needs the token on disk.
          persist-credentials: false
          # Sparse checkout also fetches blobs on demand; root media assets are not CI inputs.
          sparse-checkout: |
            app
            mobile
            scripts
            .github

      - uses: ./.github/actions/setup-app

      - name: Setup mock environment
        run: cp .env.example .env

      - name: Restore next build
        uses: actions/cache@v6
        with:
          path: app/.next/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bundle-build-${{ hashFiles('app/bun.lock', 'app/next.config.mjs') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-bundle-build-${{ hashFiles('app/bun.lock', 'app/next.config.mjs') }}-

      - name: Build next.js app
        run: ./node_modules/.bin/next build
        env:
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}

      # Collects the raw bundle stats for the current build
      - name: Analyze bundle
        run: bun run bundle:report

      - name: Upload bundle
        uses: actions/upload-artifact@v7
        with:
          name: bundle
          path: ./app/.next/analyze/__bundle_analysis.json
          overwrite: true

      - name: Download base branch bundle stats
        uses: dawidd6/action-download-artifact@v24
        if: success() && github.event.number
        with:
          workflow: nextjs_bundle_analysis.yml
          branch: ${{ github.event.pull_request.base.ref }}
          path: ./app/.next/analyze/base

      # Compares the current and base branch bundle stats; thresholds come from
      # `nextBundleAnalysis` in app/package.json.
      - name: Compare with base branch bundle
        if: success() && github.event.number
        run: bun run bundle:compare

      - name: Get Comment Body
        id: get-comment-body
        if: success() && github.event.number
        # https://docs.github.com/en/actions/using-workflows/workflow-commands-for-github-actions#multiline-strings
        run: |
          # The analyzer leaves the report empty when bundle sizes are unchanged.
          if [ ! -s .next/analyze/__bundle_analysis_comment.txt ]; then
            exit 0
          fi
          {
            echo "body<<EOF"
            cat .next/analyze/__bundle_analysis_comment.txt
            echo
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Find Comment
        uses: peter-evans/find-comment@v4
        if: success() && github.event.number && steps.get-comment-body.outputs.body != ''
        id: fc
        with:
          issue-number: ${{ github.event.number }}
          comment-author: "github-actions[bot]"
          body-includes: "<!-- __NEXTJS_BUNDLE_tnr -->"

      - name: Create Comment
        uses: peter-evans/create-or-update-comment@v5
        if: success() && github.event.number && steps.get-comment-body.outputs.body != '' && steps.fc.outputs.comment-id == 0
        with:
          issue-number: ${{ github.event.number }}
          body: ${{ steps.get-comment-body.outputs.body }}

      - name: Update Comment
        uses: peter-evans/create-or-update-comment@v5
        if: success() && github.event.number && steps.get-comment-body.outputs.body != '' && steps.fc.outputs.comment-id != 0
        with:
          issue-number: ${{ github.event.number }}
          body: ${{ steps.get-comment-body.outputs.body }}
          comment-id: ${{ steps.fc.outputs.comment-id }}
          edit-mode: replace
