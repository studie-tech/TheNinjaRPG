name: "Next.js Bundle Analysis"

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - "app/**"
      - ".github/workflows/nextjs_bundle_analysis.yml"
  push:
    branches:
      - main
    paths:
      - "app/**"
      - ".github/workflows/nextjs_bundle_analysis.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    # change this if your nextjs app does not live at the root of the repo
    working-directory: ./app/

permissions:
  contents: read # for checkout repository
  actions: read # for fetching base branch bundle stats
  pull-requests: write # for comments

jobs:
  secret-check:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    outputs:
      HAS_CLERK_KEY: ${{ steps.check-secret.outputs.hasSecret }}
    steps:
      - name: Check secret
        working-directory: .
        id: check-secret
        env:
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY != '' }}
        run: echo "hasSecret=$CLERK_SECRET_KEY" >> "$GITHUB_OUTPUT"

  analyze:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: secret-check
    if: needs.secret-check.outputs.HAS_CLERK_KEY == 'true'

    steps:
      - uses: actions/checkout@v7
        with:
          # No step here runs git, so the job never needs the token on disk.
          persist-credentials: false
          # Sparse checkout also fetches blobs on demand; root media assets are not CI inputs.
          sparse-checkout: |
            app
            mobile
            scripts
            spacetimedb-towerdefense
            .github
            .agents
            .vscode

      - uses: ./.github/actions/setup-app

      - name: Setup mock environment
        run: cp .env.example .env

      - name: Restore next build
        uses: actions/cache@v6
        with:
          path: app/.next/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bundle-build-${{ hashFiles('app/bun.lock', 'app/next.config.mjs') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-bundle-build-${{ hashFiles('app/bun.lock', 'app/next.config.mjs') }}-

      - name: Build next.js app
        # change this if your site requires a custom build command
        run: ./node_modules/.bin/next build
        env:
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}

      # Here's the first place where next-bundle-analysis' own script is used
      # This step pulls the raw bundle stats for the current bundle
      - name: Analyze bundle
        run: bun run bundle:report

      - name: Upload bundle
        uses: actions/upload-artifact@v7
        with:
          name: bundle
          path: ./app/.next/analyze/__bundle_analysis.json
          overwrite: true

      - name: Download base branch bundle stats
        uses: dawidd6/action-download-artifact@v24
        if: success() && github.event.number
        with:
          workflow: nextjs_bundle_analysis.yml
          branch: ${{ github.event.pull_request.base.ref }}
          path: ./app/.next/analyze/base

      # And here's the second place - this runs after we have both the current and
      # base branch bundle stats, and will compare them to determine what changed.
      # There are two configurable arguments that come from package.json:
      #
      # - budget: optional, set a budget (bytes) against which size changes are measured
      #           it's set to 350kb here by default, as informed by the following piece:
      #           https://infrequently.org/2021/03/the-performance-inequality-gap/
      #
      # - red-status-percentage: sets the percent size increase where you get a red
      #                          status indicator, defaults to 20%
      #
      # Either of these arguments can be changed or removed by editing the `nextBundleAnalysis`
      # entry in your package.json file.
      - name: Compare with base branch bundle
        if: success() && github.event.number
        run: bun run bundle:compare

      - name: Get Comment Body
        id: get-comment-body
        if: success() && github.event.number
        # https://docs.github.com/en/actions/using-workflows/workflow-commands-for-github-actions#multiline-strings
        run: |
          {
            echo "body<<EOF"
            cat .next/analyze/__bundle_analysis_comment.txt
            echo
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Find Comment
        uses: peter-evans/find-comment@v4
        if: success() && github.event.number
        id: fc
        with:
          issue-number: ${{ github.event.number }}
          body-includes: "<!-- __NEXTJS_BUNDLE -->"

      - name: Create Comment
        uses: peter-evans/create-or-update-comment@v5
        if: success() && github.event.number && steps.fc.outputs.comment-id == 0
        with:
          issue-number: ${{ github.event.number }}
          body: ${{ steps.get-comment-body.outputs.body }}

      - name: Update Comment
        uses: peter-evans/create-or-update-comment@v5
        if: success() && github.event.number && steps.fc.outputs.comment-id != 0
        with:
          issue-number: ${{ github.event.number }}
          body: ${{ steps.get-comment-body.outputs.body }}
          comment-id: ${{ steps.fc.outputs.comment-id }}
          edit-mode: replace
