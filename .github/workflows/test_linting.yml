name: test_linting
on: pull_request

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    uses: ./.github/workflows/app-ci-changes.yml
  test_linting:
    needs: changes
    if: needs.changes.outputs.has_changes == 'true'
    name: test_linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # No step here runs git, so the job never needs the token on disk.
          persist-credentials: false
          # Sparse checkout also fetches blobs on demand; root media assets are not CI inputs.
          sparse-checkout: |
            app
            mobile
            scripts
            spacetimedb-towerdefense
            .github
            .agents
            .vscode
      - uses: ./.github/actions/setup-app
      - name: run lint
        run: bun run lint
        working-directory: ./app
