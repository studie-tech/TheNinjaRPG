# TNR Reviewer / Reproducer — launches a Codex agent with Playwright MCP
# against a Vercel preview deployment.
#
# Triggers:
#   • `/tnr-review-now` as the entire comment on any PR (no extra text allowed)
#   • `/tnr-repro-now` on any issue (optional extra instructions after the command).
#     Gated to repository team members (write/maintain/admin), not the comment allowlist.
#   • Manual workflow_dispatch with a PR number or an issue number
#
# Modes:
#   • pr-review: smoke-test the PR's own Vercel preview
#   • issue-repro: try to reproduce the issue on a Preview – tnr deploy of
#     latest main. We never use production (broker is preview-only) and never
#     grab "whatever preview is newest" (that is almost always a PR head).
#     If main has no preview yet, we point `tnr-preview/main` at the main SHA
#     so Vercel's existing GitHub integration builds one, then reuse it.
#
# Pipeline: command_gate → preview_check → run_tnr_reviewer
#   1. command_gate: validates the trigger, checks actor permissions, fetches metadata
#   2. preview_check: PR → existing Vercel check URL; issue → resolve/create main preview
#   3. run_tnr_reviewer: checks out the target SHA, builds a prompt, runs Codex, posts results
name: TNR Reviewer

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to review (PR mode)"
        required: false
        type: number
      issue_number:
        description: "Issue number to reproduce (issue mode)"
        required: false
        type: number
      extra_instructions:
        description: "Optional additional instructions for the agent"
        required: false
        type: string

jobs:
  # ── Job 1: Parse the trigger, enforce actor allowlist, fetch metadata ──
  command_gate:
    # Quick filter: only fire on comments containing a slash command,
    # or on manual workflow_dispatch. This avoids spinning up runners for
    # unrelated issue comments.
    if: >-
      (github.event_name == 'issue_comment' &&
      (startsWith(github.event.comment.body, '/tnr-review-now') ||
       startsWith(github.event.comment.body, '/tnr-repro-now'))) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ${{ vars.TNR_REVIEWER_RUNNER_LABEL || 'blacksmith-2vcpu-ubuntu-2404' }}
    permissions:
      issues: write
      pull-requests: write
      checks: read
      contents: read
    outputs:
      should_run: ${{ steps.parse.outputs.should_run }}
      mode: ${{ steps.parse.outputs.mode }}
      pr_number: ${{ steps.parse.outputs.pr_number }}
      issue_number: ${{ steps.parse.outputs.issue_number }}
      comment_id: ${{ steps.initial_comment.outputs.comment_id }}
      head_sha: ${{ steps.parse.outputs.head_sha }}
      title: ${{ steps.parse.outputs.title }}
      body: ${{ steps.parse.outputs.body }}
      author: ${{ steps.parse.outputs.author }}
      extra_instructions: ${{ steps.parse.outputs.extra_instructions }}
      command: ${{ steps.parse.outputs.command }}
    steps:
      - name: Parse command and validate actor
        id: parse
        uses: actions/github-script@v9
        env:
          ALLOW_USERS: ${{ vars.TNR_REVIEWER_ALLOW_USERS }}
        with:
          script: |
            const isWorkflowDispatch = context.eventName === 'workflow_dispatch';
            const actor = isWorkflowDispatch
              ? context.actor
              : context.payload.comment.user.login;

            const reviewExact = /^\/tnr-review-now\s*$/i;
            const reproCmd = /^\/tnr-repro-now(?:\s+([\s\S]*))?$/i;
            const teamPermissions = new Set(['admin', 'maintain', 'write']);

            let mode = '';
            let extraInstructions = '';
            let issueNumber = 0;
            let command = '';

            if (isWorkflowDispatch) {
              const prNumber = Number(context.payload.inputs?.pr_number);
              const issueInput = Number(context.payload.inputs?.issue_number);
              extraInstructions = context.payload.inputs?.extra_instructions ?? '';
              const hasPr = Number.isInteger(prNumber) && prNumber > 0;
              const hasIssue = Number.isInteger(issueInput) && issueInput > 0;
              if (hasPr && hasIssue) {
                core.setFailed('Provide only one of pr_number or issue_number.');
                return;
              }
              if (hasPr) {
                mode = 'pr-review';
                issueNumber = prNumber;
                command = '/tnr-review-now';
              } else if (hasIssue) {
                mode = 'issue-repro';
                issueNumber = issueInput;
                command = '/tnr-repro-now';
              } else {
                core.setOutput('should_run', 'false');
                return;
              }
            } else {
              const body = (context.payload.comment.body ?? '').trim();
              const isPr = Boolean(context.payload.issue.pull_request);
              issueNumber = context.issue.number;

              if (reviewExact.test(body)) {
                if (!isPr) {
                  await github.rest.issues.createComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: issueNumber,
                    body: '`/tnr-review-now` is for pull requests. On issues, use `/tnr-repro-now`.',
                  });
                  core.setOutput('should_run', 'false');
                  return;
                }
                mode = 'pr-review';
                command = '/tnr-review-now';
              } else {
                const reproMatch = body.match(reproCmd);
                if (!reproMatch) {
                  core.setOutput('should_run', 'false');
                  return;
                }
                if (isPr) {
                  await github.rest.issues.createComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: issueNumber,
                    body: '`/tnr-repro-now` is for issues. On pull requests, use `/tnr-review-now`.',
                  });
                  core.setOutput('should_run', 'false');
                  return;
                }
                mode = 'issue-repro';
                command = '/tnr-repro-now';
                extraInstructions = (reproMatch[1] ?? '').trim();
              }
            }

            if (!Number.isInteger(issueNumber) || issueNumber <= 0) {
              core.setOutput('should_run', 'false');
              return;
            }

            if (!isWorkflowDispatch && mode === 'issue-repro') {
              // Anyone can comment `/tnr-repro-now`, so authorize via repo write access.
              let permission = '';
              try {
                const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  username: actor,
                });
                permission = data.permission ?? '';
              } catch {
                permission = '';
              }
              if (!teamPermissions.has(permission)) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  body: `@${actor} is not allowed to trigger \`/tnr-repro-now\`. Only repository team members can run this.`,
                });
                core.setOutput('should_run', 'false');
                return;
              }
            } else if (!isWorkflowDispatch) {
              // Actor allowlist — fail closed for PR review comments (require explicit config).
              // workflow_dispatch already requires repo write/admin to trigger.
              const allowUsers = (process.env.ALLOW_USERS ?? '')
                .split(',')
                .map((value) => value.trim())
                .filter(Boolean);
              if (allowUsers.length === 0) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  body: 'TNR reviewer is blocked: `TNR_REVIEWER_ALLOW_USERS` is not configured.',
                });
                core.setOutput('should_run', 'false');
                return;
              }
              if (!allowUsers.includes(actor)) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  body: `@${actor} is not allowed to trigger \`${command}\`.`,
                });
                core.setOutput('should_run', 'false');
                return;
              }
            }

            core.setOutput('mode', mode);
            core.setOutput('command', command);
            core.setOutput('extra_instructions', extraInstructions.slice(0, 2000));
            core.setOutput('issue_number', String(issueNumber));

            if (mode === 'pr-review') {
              const { data: pr } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: issueNumber,
              });
              core.setOutput('should_run', 'true');
              core.setOutput('pr_number', String(pr.number));
              core.setOutput('head_sha', pr.head.sha);
              core.setOutput('title', (pr.title ?? '').slice(0, 256));
              core.setOutput('body', (pr.body ?? '').slice(0, 4000));
              core.setOutput('author', pr.user?.login ?? '');
              return;
            }

            const [issueRes, repoRes] = await Promise.all([
              github.rest.issues.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
              }),
              github.rest.repos.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
              }),
            ]);
            const defaultBranch = repoRes.data.default_branch;
            const { data: ref } = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `heads/${defaultBranch}`,
            });
            core.setOutput('should_run', 'true');
            core.setOutput('pr_number', '');
            core.setOutput('head_sha', ref.object.sha);
            core.setOutput('title', (issueRes.data.title ?? '').slice(0, 256));
            core.setOutput('body', (issueRes.data.body ?? '').slice(0, 4000));
            core.setOutput('author', issueRes.data.user?.login ?? '');

      # Post a "started" comment that will be updated in-place with results later.
      # continue-on-error: true because GITHUB_TOKEN may lack issues:write on
      # some forks — we don't want a missing comment to abort the whole run.
      - name: Post initial comment
        if: steps.parse.outputs.should_run == 'true'
        id: initial_comment
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          script: |
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            const issueNumber = Number('${{ steps.parse.outputs.issue_number }}');
            const mode = '${{ steps.parse.outputs.mode }}';
            const command = '${{ steps.parse.outputs.command }}';
            const headSha = '${{ steps.parse.outputs.head_sha }}';
            const isIssueRepro = mode === 'issue-repro';
            const { data: comment } = await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: [
                isIssueRepro ? '## TNR reproducer started' : '## TNR reviewer started',
                '',
                `Mode: \`${mode}\``,
                `Command: \`${command}\``,
                isIssueRepro
                  ? `Target: latest \`main\` (\`${headSha.slice(0, 7)}\`) — will reuse or create a Preview – tnr deploy of that SHA (not production, not a random PR preview).`
                  : null,
                `Run: [View workflow run](${runUrl})`,
                '',
                '> This comment will be updated with findings and screenshot links.',
              ].filter((line) => line !== null).join('\n'),
            });
            core.setOutput('comment_id', String(comment.id));

  # ── Job 2: Verify / create the Vercel preview and extract its URL ──
  preview_check:
    needs: command_gate
    if: needs.command_gate.outputs.should_run == 'true'
    runs-on: ${{ vars.TNR_REVIEWER_RUNNER_LABEL || 'blacksmith-2vcpu-ubuntu-2404' }}
    timeout-minutes: 35
    concurrency:
      group: tnr-preview-${{ needs.command_gate.outputs.mode }}-${{ needs.command_gate.outputs.mode == 'issue-repro' && 'main' || needs.command_gate.outputs.pr_number }}
      cancel-in-progress: false
    permissions:
      checks: read
      pull-requests: read
      issues: write
      contents: read
      deployments: read
    outputs:
      is_ready: ${{ steps.check_preview.outputs.is_ready }}
      preview_url: ${{ steps.check_preview.outputs.preview_url }}
      reason: ${{ steps.check_preview.outputs.reason }}
      check_name: ${{ steps.check_preview.outputs.check_name }}
      details_url: ${{ steps.check_preview.outputs.details_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Check Vercel preview health
        id: check_preview
        run: |
          if [ "$MODE" = "issue-repro" ]; then
            node .github/scripts/resolve-main-preview.mjs
          else
            node .github/scripts/check-preview-ready.mjs
          fi
        env:
          MODE: ${{ needs.command_gate.outputs.mode }}
          GITHUB_TOKEN: ${{ github.token }}
          PUSH_TOKEN: ${{ secrets.PAT_TOKEN }}
          PR_NUMBER: ${{ needs.command_gate.outputs.pr_number }}
          MAIN_SHA: ${{ needs.command_gate.outputs.head_sha }}
          TNR_MAIN_PREVIEW_URL: ${{ vars.TNR_MAIN_PREVIEW_URL }}
          PREVIEW_BRANCH: ${{ vars.TNR_MAIN_PREVIEW_BRANCH || 'tnr-preview/main' }}
          VERCEL_CHECK_NAME_PATTERN: ${{ vars.TNR_VERCEL_CHECK_PATTERN || 'vercel' }}

      # If the preview isn't ready, update the comment with the reason
      # so the user knows why the run was skipped
      - name: Post blocked reason
        if: steps.check_preview.outputs.is_ready != 'true'
        run: node .github/scripts/post-tnr-result.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ needs.command_gate.outputs.issue_number }}
          COMMENT_ID: ${{ needs.command_gate.outputs.comment_id }}
          RESULT: blocked
          MODE: ${{ needs.command_gate.outputs.mode }}
          BLOCK_REASON: ${{ steps.check_preview.outputs.reason }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  # ── Job 3: Check out the target SHA, run the Codex agent, and post results ──
  run_tnr_reviewer:
    needs: [command_gate, preview_check]
    if: needs.preview_check.outputs.is_ready == 'true'
    runs-on: ${{ vars.TNR_REVIEWER_RUNNER_LABEL || 'blacksmith-2vcpu-ubuntu-2404' }}
    # One agent per PR/issue at a time; don't cancel in-progress to avoid partial reports
    concurrency:
      group: tnr-reviewer-${{ needs.command_gate.outputs.mode }}-${{ needs.command_gate.outputs.issue_number }}
      cancel-in-progress: false
    timeout-minutes: 60
    permissions:
      contents: read
      issues: write
      pull-requests: write
      checks: read
      actions: read
    steps:
      # First checkout: default branch scripts (trusted — not PR-controlled).
      # These run with secrets in env, so they MUST NOT come from the PR head.
      - name: Checkout trusted scripts
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          path: trusted-scripts

      - name: Cache trusted helper scripts
        run: |
          mkdir -p "$RUNNER_TEMP/tnr-scripts"
          cp trusted-scripts/.github/scripts/ci-helpers.mjs "$RUNNER_TEMP/tnr-scripts/"
          cp trusted-scripts/.github/scripts/build-tnr-review-prompt.mjs "$RUNNER_TEMP/tnr-scripts/"
          cp trusted-scripts/.github/scripts/post-tnr-result.mjs "$RUNNER_TEMP/tnr-scripts/"
          cp trusted-scripts/.github/scripts/upload-screenshots.mjs "$RUNNER_TEMP/tnr-scripts/"

      # Second checkout: PR head for review, or main SHA for issue repro
      - name: Checkout target ref
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          token: ${{ secrets.PAT_TOKEN }}
          ref: ${{ needs.command_gate.outputs.mode == 'pr-review' && format('refs/pull/{0}/head', needs.command_gate.outputs.pr_number) || needs.command_gate.outputs.head_sha }}

      # Set up Playwright MCP as a stdio server for Codex, plus artifact dirs.
      # No extraHTTPHeaders — those leak into cross-origin requests (Clerk JS)
      # and break auth. Vercel bypass is handled via query-param cookies instead.
      - name: Configure Codex MCP and artifacts
        shell: bash
        run: |
          mkdir -p .artifacts/tnr-review .artifacts/screenshots "$HOME/.codex"
          printf '%s\n' \
            '[mcp_servers.playwright]' \
            'command = "npx"' \
            'args = ["-y", "@playwright/mcp@0.0.70", "--headless"]' \
            'startup_timeout_sec = 30' \
            'tool_timeout_sec = 120' \
            > "$HOME/.codex/config.toml"
          echo "Codex config.toml:"
          cat "$HOME/.codex/config.toml"

      # Use the trusted script copy, not the PR-head version
      - name: Build review prompt
        id: build_prompt
        run: node "$RUNNER_TEMP/tnr-scripts/build-tnr-review-prompt.mjs"
        env:
          PROMPT_FILE: /tmp/tnr-review-prompt.txt
          MODE: ${{ needs.command_gate.outputs.mode }}
          PREVIEW_URL: ${{ needs.preview_check.outputs.preview_url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          PR_NUMBER: ${{ needs.command_gate.outputs.pr_number }}
          PR_TITLE: ${{ needs.command_gate.outputs.mode == 'pr-review' && needs.command_gate.outputs.title || '' }}
          PR_BODY: ${{ needs.command_gate.outputs.mode == 'pr-review' && needs.command_gate.outputs.body || '' }}
          PR_AUTHOR: ${{ needs.command_gate.outputs.mode == 'pr-review' && needs.command_gate.outputs.author || '' }}
          ISSUE_NUMBER: ${{ needs.command_gate.outputs.issue_number }}
          ISSUE_TITLE: ${{ needs.command_gate.outputs.mode == 'issue-repro' && needs.command_gate.outputs.title || '' }}
          ISSUE_BODY: ${{ needs.command_gate.outputs.mode == 'issue-repro' && needs.command_gate.outputs.body || '' }}
          ISSUE_AUTHOR: ${{ needs.command_gate.outputs.mode == 'issue-repro' && needs.command_gate.outputs.author || '' }}
          MAIN_SHA: ${{ needs.command_gate.outputs.head_sha }}
          COMMAND_AUTHOR: ${{ github.actor }}
          REPOSITORY: ${{ github.repository }}
          EXTRA_INSTRUCTIONS: ${{ needs.command_gate.outputs.extra_instructions || github.event.inputs.extra_instructions || '' }}
          AI_TEST_USER_BROKER_TOKEN: ${{ secrets.AI_TEST_USER_BROKER_TOKEN }}

      # Non-blocking liveness probe — accepts any non-5xx response.
      # The Playwright agent handles Vercel bypass cookies natively.
      - name: Wait for Vercel deployment
        shell: bash
        env:
          PREVIEW_URL: ${{ needs.preview_check.outputs.preview_url }}
          VERCEL_BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          echo "Waiting for Vercel deployment to stabilize..."
          for i in $(seq 1 18); do
            status=$(curl -s -o /dev/null -w "%{http_code}" \
              -H "x-vercel-protection-bypass: ${VERCEL_BYPASS}" \
              "${PREVIEW_URL}" 2>/dev/null || echo "000")
            echo "Attempt $i: HTTP $status"
            if [ "$status" != "000" ] && [ "$status" != "502" ] && [ "$status" != "503" ] && [ "$status" != "504" ]; then
              echo "Deployment is live (HTTP $status). Bypass handled by agent."
              exit 0
            fi
            sleep 10
          done
          echo "::warning::Could not verify deployment liveness, proceeding anyway."

      # danger-full-access: Codex needs network + filesystem for Playwright MCP
      # and writing artifacts. The prompt file contains security instructions to
      # constrain what the agent actually does.
      - name: Run Codex reviewer
        id: run_codex
        uses: openai/codex-action@0b91f4a2703c23df3102c3f0967d3c6db34eedef # v1
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          AI_TEST_USER_BROKER_TOKEN: ${{ secrets.AI_TEST_USER_BROKER_TOKEN }}
        with:
          openai-api-key: ${{ secrets.AZURE_API_KEY }}
          responses-api-endpoint: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          model: "gpt-5.4-2026-03-05"
          sandbox: "danger-full-access"
          safety-strategy: "unsafe"
          allow-users: ${{ vars.TNR_CODEX_ALLOW_USERS || 'MathiasGruber' }}
          prompt-file: ${{ steps.build_prompt.outputs.prompt_file }}

      # Always upload artifacts (screenshots, logs) even on failure for debugging
      - name: Upload TNR artifacts
        if: always()
        id: upload_artifacts
        uses: actions/upload-artifact@v7
        with:
          name: tnr-reviewer-${{ needs.command_gate.outputs.mode }}-${{ needs.command_gate.outputs.issue_number }}-${{ github.run_id }}
          path: .artifacts
          if-no-files-found: warn
          retention-days: 7

      # Push screenshots to a dedicated orphan branch so they're viewable via
      # raw.githubusercontent.com URLs embedded directly in the comment.
      - name: Upload screenshots for comment
        if: always()
        id: upload_screenshots
        continue-on-error: true
        run: node "$RUNNER_TEMP/tnr-scripts/upload-screenshots.mjs"
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          PR_NUMBER: ${{ needs.command_gate.outputs.pr_number }}
          ISSUE_NUMBER: ${{ needs.command_gate.outputs.issue_number }}
          SCREENSHOTS_DIR: .artifacts/screenshots

      # Replace the "started" comment with the final outcome (success/failure).
      # Uses the trusted script copy, not the PR-head version.
      - name: Update comment with result
        if: always()
        run: node "$RUNNER_TEMP/tnr-scripts/post-tnr-result.mjs"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ needs.command_gate.outputs.issue_number }}
          COMMENT_ID: ${{ needs.command_gate.outputs.comment_id }}
          RESULT: ${{ steps.run_codex.outcome == 'success' && 'success' || 'failed' }}
          MODE: ${{ needs.command_gate.outputs.mode }}
          FINAL_MESSAGE: ${{ steps.run_codex.outputs.final-message }}
          ARTIFACT_URL: ${{ steps.upload_artifacts.outputs.artifact-url }}
          SCREENSHOT_MARKDOWN: ${{ steps.upload_screenshots.outputs.screenshot_markdown }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
