name: test_build
on: pull_request

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    uses: ./.github/workflows/app-ci-changes.yml
  test_build:
    needs: changes
    if: needs.changes.outputs.has_changes == 'true'
    name: test_build
    runs-on: blacksmith-4vcpu-ubuntu-2404
    # Database for tests that need to execute real SQL. 8.0 matches PlanetScale. Every table in
    # it is truncated on setup, hence the explicit opt-in below. Suites that use it skip when
    # the variables are unset, so a local `bun test` needs no database.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: tnr_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v7
        with:
          # No step here runs git, so the job never needs the token on disk.
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - name: install dependencies
        run: bun install
        working-directory: ./app
      - name: run tests
        run: bun test
        working-directory: ./app
      - name: run build
        run: bun run build
        working-directory: ./app
    env:
      # Fork pull requests receive empty secrets. An empty Pusher secret fails HMAC
      # import, and an empty public URL fails configuration parsing for both steps.
      NEXT_PUBLIC_PUSHER_APP_KEY: ${{ secrets.NEXT_PUBLIC_PUSHER_APP_KEY || 'test-key' }}
      NEXT_PUBLIC_PUSHER_APP_CLUSTER: ${{ secrets.NEXT_PUBLIC_PUSHER_APP_CLUSTER || 'mt1' }}
      NEXT_PUBLIC_BASE_URL: ${{ secrets.NEXT_PUBLIC_BASE_URL || 'http://localhost:3000' }}
      PUSHER_APP_ID: ${{ secrets.PUSHER_APP_ID || 'test-app' }}
      PUSHER_APP_SECRET: ${{ secrets.PUSHER_APP_SECRET || 'test-secret' }}
      DATABASE_URL: ${{ secrets.NEXT_PUBLIC_BASE_URL || 'http://127.0.0.1:1' }}
      CAPTCHA_SALT: ${{ secrets.CAPTCHA_SALT }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || 'test-placeholder-not-a-real-key' }}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      NODE_OPTIONS: "--max-old-space-size=4096"
      TEST_MYSQL_URL: "mysql://root@127.0.0.1:3306/tnr_test"
      TEST_MYSQL_ALLOW_DESTRUCTIVE: "1"
