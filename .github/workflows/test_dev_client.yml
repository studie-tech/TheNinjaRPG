name: test_dev_client
on: pull_request
jobs:
  test_dev_client:
    name: test_dev_client
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: install dependencies
        run: bun install
        working-directory: ./dev-client
      - name: typecheck
        run: bun run typecheck
        working-directory: ./dev-client
      - name: lint
        run: bun run lint
        working-directory: ./dev-client
      - name: run tests
        run: bun test
        working-directory: ./dev-client

  tauri_check:
    name: tauri_check
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: build frontend (required by tauri::generate_context)
        run: bun run build
        working-directory: ./dev-client
      - name: install rust
        run: curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
      - name: install tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev pkg-config
      - name: cargo check
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo check
        working-directory: ./dev-client/src-tauri
