name: Detect application CI changes

on:
  workflow_call:
    outputs:
      has_changes:
        value: ${{ jobs.changes.outputs.has_changes }}

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.changes.outputs.has_changes }}
    steps:
      - uses: actions/github-script@v9
        id: changes
        with:
          script: |
            const files = await github.paginate(github.rest.pulls.listFiles, {
              ...context.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100,
            });
            // Keep required checks present while skipping documentation-only PRs.
            // Application Markdown can be build input, so only root docs are excluded.
            const isDocumentation = (path) =>
              /^[^/]+\.md$/i.test(path) ||
              /^(docs\/|\.github\/ISSUE_TEMPLATE\/)/.test(path) ||
              path === ".github/pull_request_template.md";
            // Renames must also consider the old path, and a truncated API result
            // must conservatively run checks (GitHub returns at most 3,000 files).
            const hasChanges = files.length >= 3000 || files.some((file) =>
              !isDocumentation(file.filename) ||
              (file.previous_filename && !isDocumentation(file.previous_filename))
            );
            core.setOutput("has_changes", String(hasChanges));
