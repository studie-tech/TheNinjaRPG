[package]
name = "towerdefense"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
spacetimedb = "=2.15.0"
log = "=0.4.35"
rand = { version = "=0.10.3", default-features = false }
rand_chacha = { version = "=0.10.0", default-features = false }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"

[profile.release]
opt-level = "s"

