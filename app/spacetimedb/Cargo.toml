[package]
name = "towerdefense"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
spacetimedb = "1.11.1"
log = "0.4"
rand = { version = "0.10", default-features = false }
rand_chacha = { version = "0.10", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = "s"

